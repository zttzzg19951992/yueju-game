<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>镜遇粤彩·衣秒入戏｜粤剧互动小游戏</title>
<style>
:root {
  --red: #9B1C1C;
  --ok: #2E7D32;
  --err: #D32F2F;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: "微软雅黑", sans-serif;
  background: #F2E4D1;
  color: #333;
  padding: 20px 10px;
}
.stage-top {
  background: #9B1C1C;
  color: #fff;
  text-align: center;
  padding: 20px 10px;
  border-radius: 12px;
  margin-bottom: 20px;
}
h1 {
  font-size: 32px;
  letter-spacing: 3px;
}
.subtitle {
  font-size: 16px;
  color: #FFD99D;
  margin-top: 8px;
}
.category-tabs {
  max-width: 600px;
  margin: 0 auto 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}
.tab-btn {
  padding: 12px 24px;
  background: #9B1C1C;
  color: #fff;
  border: none;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
}
.tab-btn.active {
  background: #C72027;
}
.score-bar {
  max-width: 600px;
  margin: 0 auto 15px;
  background: #fff;
  border: 2px solid #9B1C1C;
  border-radius: 10px;
  padding: 12px;
  display: flex;
  justify-content: space-between;
}
.score {
  color: #9B1C1C;
  font-weight: bold;
}
.game-card {
  max-width: 600px;
  margin: 0 auto;
  background: #fff;
  border: 2px solid #9B1C1C;
  border-radius: 16px;
  padding: 25px;
}
.game-title {
  font-size: 22px;
  color: #9B1C1C;
  text-align: center;
  margin-bottom: 20px;
  font-weight: bold;
}
.question {
  font-size: 18px;
  text-align: center;
  margin-bottom: 20px;
}
.btn {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: 2px solid #9B1C1C;
  background: #fff;
  color: #9B1C1C;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}
.btn:hover {
  background: #9B1C1C;
  color: #fff;
}
.btn.ok {
  border-color: var(--ok);
  background: var(--ok);
  color: #fff;
}
.btn.err {
  border-color: var(--err);
  background: var(--err);
  color: #fff;
}
.answer-box {
  margin-top: 15px;
  padding: 15px;
  border-radius: 10px;
  display: none;
  line-height: 1.6;
}
.answer-box.ok {
  background: #e6f5e6;
  border: 1px solid var(--ok);
  color: #1B5E20;
}
.answer-box.err {
  background: #ffe9e9;
  border: 1px solid var(--err);
  color: #B71C1C;
}
.next-btn {
  margin-top: 20px;
  background: #9B1C1C;
  color: #fff;
  border: none;
  font-weight: bold;
}

/* 拖拽连线 */
.link-wrap {
  position: relative;
  min-height: 280px;
}
.link-col {
  position: absolute;
  top: 0;
  display: flex;
  flex-direction: column;
  gap: 15px;
}
.link-col.left { left: 20px; }
.link-col.right { right: 20px; }
.link-node {
  padding: 10px 15px;
  border: 2px solid #9B1C1C;
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
  user-select: none;
}
.link-node.active { background: #9B1C1C; color: #fff; }
svg.link-svg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* 口诀填空 */
.poem-line {
  font-size: 20px;
  text-align: center;
  margin: 12px 0;
}
.poem-input {
  width: 50px;
  text-align: center;
  border: none;
  border-bottom: 2px solid #9B1C1C;
  font-size: 20px;
  color: #9B1C1C;
  background: transparent;
  outline: none;
}
</style>
</head>
<body>

<div class="stage-top">
  <h1>镜遇粤彩·衣秒入戏</h1>
  <p class="subtitle">粤剧互动小游戏｜历史·行当·服饰</p>
</div>

<div class="category-tabs">
  <button class="tab-btn active" onclick="switchGame(0)">粤剧历史</button>
  <button class="tab-btn" onclick="switchGame(1)">五大行当</button>
  <button class="tab-btn" onclick="switchGame(2)">粤剧服饰</button>
</div>

<div class="score-bar">
  <span>当前进度：<span id="progress">1/3</span></span>
  <span>总分：<span class="score" id="score">0</span> 分</span>
</div>

<div class="game-card" id="gameBox">
  <h2 class="game-title" id="gameTitle">游戏加载中...</h2>
  <div id="qBox" class="question"></div>
  <div id="ansBox" class="answer-box"></div>
  <button class="btn next-btn" id="nextBtn" style="display:none;"></button>
</div>

<script>
const games = [
  {
    category: "粤剧历史",
    list: [
      {
        q: "粤剧最早形成于哪个朝代？",
        opts: ["A. 唐朝", "B. 明朝", "C. 清朝", "D. 民国"],
        ans: 2,
        exp: "粤剧形成于清代，流行于广东、广西、港澳及海外华人区，是岭南戏曲代表。"
      },
      {
        q: "粤剧属于我国第几批非物质文化遗产？",
        opts: ["A. 第一批", "B. 第二批", "C. 第三批", "D. 第四批"],
        ans: 0,
        exp: "2006年粤剧列入第一批国家级非遗；2009年入选世界非物质文化遗产。"
      },
      {
        q: "粤剧的传统声腔主要来自？",
        opts: ["A. 梆子、二黄", "B. 昆曲、弋阳腔", "C. 海盐腔、余姚腔"],
        ans: 0,
        exp: "粤剧以梆子、二黄为主腔，融合民间小调，唱腔婉转。"
      }
    ]
  },
  {
    category: "五大行当",
    list: [
      {
        type: "dragline",
        q: "拖拽连线：行当 → 特征（生、旦、净、末、丑）",
        left: ["生", "旦", "净", "末", "丑"],
        right: ["有文巾武靠旗", "穿云袖分花衣", "戴额子大脸谱", "扮中年稳当样", "涂白鼻八字髯"],
        ans: [0,1,2,3,4],
        exp: "生：有文巾武靠旗；旦：穿云袖分花衣；净：戴额子大脸谱；末：扮中年稳当样；丑：涂白鼻八字髯。"
      },
      {
        type: "poemfill",
        q: "补全五大行当口诀（生、旦、净、末、丑）",
        lines: [
          "____有文巾武靠旗，",
          "____穿云袖分花衣。",
          "____戴额子大脸谱，",
          "____扮中年稳当样，",
          "____涂白鼻八字髯。"
        ],
        ans: ["生","旦","净","末","丑"],
        exp: "完整口诀：生有文巾武靠旗，旦穿云袖分花衣。净戴额子大脸谱，末扮中年稳当样，丑涂白鼻八字髯。"
      }
    ]
  },
  {
    category: "粤剧服饰",
    list: [
      {
        q: "粤剧服饰中，红色官袍通常代表？",
        opts: ["A. 忠臣/高官", "B. 反派奸臣", "C. 平民百姓", "D. 神仙"],
        ans: 0,
        exp: "红色=忠勇尊贵；黑=刚直；白=奸诈/年少；黄=皇室。"
      },
      {
        q: "广绣龙纹、金底大红的戏服，最可能是？",
        opts: ["A. 文生", "B. 旦角", "C. 帝王/王侯", "D. 丑角"],
        ans: 2,
        exp: "龙纹+金红：帝王、王侯等高阶角色专属，象征尊贵权力。"
      },
      {
        q: "云肩+水袖、绣花短衣长裙，属于哪个行当典型服饰？",
        opts: ["A. 生", "B. 旦", "C. 净", "D. 丑"],
        ans: 1,
        exp: "云肩、水袖、绣花裙：旦角标志性装扮，柔美华丽。"
      },
      {
        q: "黑靠、虎头肩、大髯口、脸谱，属于？",
        opts: ["A. 文生", "B. 花旦", "C. 武净（大花脸）", "D. 小丑"],
        ans: 2,
        exp: "黑靠、虎头肩：武净（武花脸），勇猛武将，刚猛威严。"
      }
    ]
  }
];

let currentGameIndex = 0, q = 0, score = 0;
let curGame, curQ;

// 拖拽连线状态
let dragStart = null;
let drawnLines = [];

// 填空状态
let fillInputs = [];

const gameTitle = document.getElementById("gameTitle");
const qBox = document.getElementById("qBox");
const ansBox = document.getElementById("ansBox");
const nextBtn = document.getElementById("nextBtn");
const scoreEl = document.getElementById("score");
const progressEl = document.getElementById("progress");
const tabBtns = document.querySelectorAll(".tab-btn");

function switchGame(index) {
  currentGameIndex = index;
  q = 0;
  tabBtns.forEach((btn, i) => btn.classList.toggle("active", i === index));
  loadGame();
}

function loadGame() {
  curGame = games[currentGameIndex];
  gameTitle.innerText = curGame.category + "挑战";
  loadQuestion();
}

function loadQuestion() {
  if (q >= curGame.list.length) {
    gameTitle.innerText = "🎉 本分类完成！";
    qBox.innerHTML = `<p>请点击上方按钮选择其他分类继续挑战</p>`;
    ansBox.style.display = "none";
    nextBtn.style.display = "none";
    updateProgress();
    return;
  }
  curQ = curGame.list[q];
  updateProgress();
  ansBox.style.display = "none";
  nextBtn.style.display = "none";

  if (curQ.type === "dragline") renderDragLine();
  else if (curQ.type === "poemfill") renderPoemFill();
  else renderChoice();
}

// 单选题
function renderChoice() {
  qBox.innerHTML = `<div class="question">${curQ.q}</div>`;
  const btnWrapper = document.createElement("div");
  curQ.opts.forEach((txt, i) => {
    const btn = document.createElement("button");
    btn.className = "btn";
    btn.innerText = txt;
    btn.onclick = () => selectAnswer(i, btn);
    btnWrapper.appendChild(btn);
  });
  qBox.appendChild(btnWrapper);
}

// 拖拽连线
function renderDragLine() {
  dragStart = null;
  drawnLines = [];
  qBox.innerHTML = `<div class="question">${curQ.q}</div>`;

  const wrap = document.createElement("div");
  wrap.className = "link-wrap";
  wrap.innerHTML = `<svg class="link-svg" id="linkSvg"></svg>`;

  const leftCol = document.createElement("div");
  leftCol.className = "link-col left";
  curQ.left.forEach((text, i) => {
    const node = document.createElement("div");
    node.className = "link-node";
    node.innerText = text;
    node.dataset.side = "left";
    node.dataset.idx = i;
    node.onmousedown = () => startDrag(node);
    node.ontouchstart = (e) => {e.preventDefault(); startDrag(node);};
    leftCol.appendChild(node);
  });

  const rightCol = document.createElement("div");
  rightCol.className = "link-col right";
  curQ.right.forEach((text, i) => {
    const node = document.createElement("div");
    node.className = "link-node";
    node.innerText = text;
    node.dataset.side = "right";
    node.dataset.idx = i;
    node.onmouseup = () => endDrag(node);
    node.ontouchend = (e) => {e.preventDefault(); endDrag(node);};
    rightCol.appendChild(node);
  });

  wrap.appendChild(leftCol);
  wrap.appendChild(rightCol);
  qBox.appendChild(wrap);

  document.onmouseup = () => dragStart = null;
  document.ontouchend = () => dragStart = null;
}

function startDrag(node) {
  if (node.dataset.side !== "left") return;
  dragStart = node;
  node.classList.add("active");
}

function endDrag(node) {
  if (!dragStart || node.dataset.side !== "right") {
    if (dragStart) dragStart.classList.remove("active");
    dragStart = null;
    return;
  }
  const pair = {
    l: +dragStart.dataset.idx,
    r: +node.dataset.idx
  };
  drawnLines.push(pair);
  drawLine(dragStart, node);
  dragStart.classList.remove("active");
  dragStart = null;

  if (drawnLines.length === curQ.left.length) checkDragLine();
}

function drawLine(from, to) {
  const svg = document.getElementById("linkSvg");
  const rect = svg.getBoundingClientRect();
  const fRect = from.getBoundingClientRect();
  const tRect = to.getBoundingClientRect();

  const x1 = fRect.left + fRect.width/2 - rect.left;
  const y1 = fRect.top + fRect.height/2 - rect.top;
  const x2 = tRect.left + tRect.width/2 - rect.left;
  const y2 = tRect.top + tRect.height/2 - rect.top;

  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("x1", x1);
  line.setAttribute("y1", y1);
  line.setAttribute("x2", x2);
  line.setAttribute("y2", y2);
  line.setAttribute("stroke", "#9B1C1C");
  line.setAttribute("stroke-width", "2");
  svg.appendChild(line);
}

function checkDragLine() {
  const ok = drawnLines.every(p => p.l === p.r);
  if (ok) {
    score += 10;
    ansBox.className = "answer-box ok";
    ansBox.innerHTML = "<strong>✅ 连线正确！+10分</strong><br>" + curQ.exp;
  } else {
    ansBox.className = "answer-box err";
    ansBox.innerHTML = `<strong>❌ 连线错误</strong><br>正确配对：${curQ.exp}`;
  }
  ansBox.style.display = "block";
  nextBtn.style.display = "block";
  updateProgress();
}

// 口诀直接填空
function renderPoemFill() {
  fillInputs = [];
  qBox.innerHTML = `<div class="question">${curQ.q}</div>`;
  curQ.lines.forEach((line, i) => {
    const lineEl = document.createElement("div");
    lineEl.className = "poem-line";
    const parts = line.split("____");
    for (let j = 0; j < parts.length; j++) {
      lineEl.innerHTML += parts[j];
      if (j < curQ.ans.length) {
        const input = document.createElement("input");
        input.className = "poem-input";
        input.maxLength = 1;
        input.dataset.idx = j;
        input.oninput = () => checkPoemFill();
        fillInputs.push(input);
        lineEl.appendChild(input);
      }
    }
    qBox.appendChild(lineEl);
  });
}

function checkPoemFill() {
  const filled = fillInputs.map(i => i.value.trim());
  const ok = filled.every((v, i) => v === curQ.ans[i]);
  if (filled.every(v => v)) {
    if (ok) {
      score += 10;
      ansBox.className = "answer-box ok";
      ansBox.innerHTML = "<strong>✅ 口诀正确！+10分</strong><br>" + curQ.exp;
    } else {
      ansBox.className = "answer-box err";
      ansBox.innerHTML = `<strong>❌ 口诀错误</strong><br>正确：${curQ.exp}`;
    }
    ansBox.style.display = "block";
    nextBtn.style.display = "block";
    updateProgress();
  }
}

// 单选判题
function selectAnswer(index, btn) {
  const allBtns = qBox.querySelectorAll(".btn");
  allBtns.forEach(b => b.disabled = true);
  if (index === curQ.ans) {
    btn.classList.add("ok");
    score += 10;
    ansBox.className = "answer-box ok";
    ansBox.innerHTML = "<strong>✅ 回答正确！+10分</strong><br>" + curQ.exp;
  } else {
    btn.classList.add("err");
    allBtns[curQ.ans].classList.add("ok");
    ansBox.className = "answer-box err";
    ansBox.innerHTML = `<strong>❌ 答错啦</strong><br>正确答案：${curQ.opts[curQ.ans]}<br>解析：${curQ.exp}`;
  }
  ansBox.style.display = "block";
  nextBtn.style.display = "block";
  updateProgress();
}

nextBtn.onclick = () => { q++; loadQuestion(); };
function updateProgress() {
  progressEl.innerText = `${q + 1}/${curGame.list.length}`;
  scoreEl.innerText = score;
}

loadGame();
</script>

</body>
</html>
